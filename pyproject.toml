[project]
name = "brain-vault-mcp"
version = "0.1.0"
description = "Encrypted, retrieval-optimized note vault exposed as an MCP server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    # sqlcipher3-binary ships prebuilt wheels for x86_64 only and has no sdist;
    # on aarch64 (Raspberry Pi) build sqlcipher3 from source against
    # libsqlcipher-dev (installed by deploy/setup.sh). Both expose `sqlcipher3`.
    "sqlcipher3-binary>=0.5.0; platform_machine == 'x86_64'",
    "sqlcipher3>=0.5.0; platform_machine != 'x86_64'",
    "sqlite-vec>=0.1.0",
    "fastembed>=0.3.0",
    "numpy>=1.24",
    "uvicorn>=0.27",
    "starlette>=0.37",
]

[project.scripts]
vault-mcp = "vault.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
